bundle:
  name: steel-claims-dashboards

variables:
  catalog:
    default: fe-bar-ir
  schema:
    default: gold
  warehouse_id:
    default: 38e458a09de4a055

resources:
  dashboards:
    quality_claims:
      display_name: Steel Quality Claims Analytics
