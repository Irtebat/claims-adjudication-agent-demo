# ---------------------------------------------------------------------------
# Config TEMPLATE — copy to config.local.yaml and fill in.
# config.local.yaml is gitignored. NEVER put secrets here; secrets live in
# Databricks secret scopes and are referenced by name, not value.
# ---------------------------------------------------------------------------

databricks:
  profile: fe-bar                       # always pass --profile fe-bar
  host: https://fe-sandbox-fe-bar-ir.cloud.databricks.com
  catalog: fe-bar-ir                    # Unity Catalog for this build
  schemas:
    bronze: bronze
    silver: silver
    gold: gold
    ops: ops                            # analytics mirror of operational tables
  warehouse_name: Serverless Starter Warehouse

# Foundation model / embedding choices.
models:
  agent_llm_endpoint: "TBD_AGENT_LLM"
  # Governed GTE embeddings via the Unity Gateway model service (GA, no provisioning).
  # 1024-dim, NOT normalized -> we L2-normalize and use cosine. No dimensions param.
  embedding_model_service: "system.ai.gte-large-en"
  embedding_gateway_path: "/ai-gateway/mlflow/v1/embeddings"
  embedding_dim: 1024
  embedding_normalization: "l2"

# Policy corpus — authored once, loaded into Lakebase by agent/src/policy_intake.py.
policy:
  source: agent/src/policy_source.json         # single source of truth
  param_tables: [spec_params, warranty_terms]  # read by the deterministic authorities
  clause_tables: [spec_clauses, warranty_clauses]  # embedded + tsvector, hybrid retrieval
  # Deterministic UC-function authorities (governed, auditable) in <catalog>.silver.
  authorities: [compute_conformance, compute_coverage, compute_settlement]

# Lakebase Autoscaling (Postgres, OLTP). Non-secret identifiers only; the OAuth
# credential is minted at runtime by the SDK, never stored here.
lakebase:
  project: fe-bar-operational-plane
  branch: production
  endpoint: projects/fe-bar-operational-plane/branches/production/endpoints/primary
  port: 5432
  pg_version: 17                        # PG17 required for Lakehouse Sync (Beta)
  database: databricks_postgres
  # Read-only UC mirror of Lakebase; the authorities read structured params here.
  catalog_mirror: fe_bar_operational
  # Credentials come from the SDK OAuth credential provider at runtime (no scope needed).

# Kafka (Aiven) — provision and verify for event streaming.
kafka:
  provider: aiven
  bootstrap_servers: "TBD_KAFKA"
  topics:
    claim_submitted: claim.submitted
    claim_adjudicated: claim.adjudicated
  secret_scope: "TBD_KAFKA"            # SASL creds by secret name, never inline

# Google Slides — living architecture/value walkthrough deck.
slides:
  presentation_id: "TBD"
  drive_folder_id: "TBD"
