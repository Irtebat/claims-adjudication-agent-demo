# ---------------------------------------------------------------------------
# Config TEMPLATE — copy to config.local.yaml and fill in.
# config.local.yaml is gitignored. NEVER put secrets here; secrets live in
# Databricks secret scopes and are referenced by name, not value.
# ---------------------------------------------------------------------------

databricks:
  profile: fe-bar-ir-2026               # always pass --profile fe-bar-ir-2026
  host: https://fe-sandbox-fe-bar-ir-2026.cloud.databricks.com
  catalog: fe-bar-ir                    # Unity Catalog for this build
  schemas:
    bronze: bronze
    silver: silver
    gold: gold
    ops: ops                            # analytics mirror of operational tables
  warehouse_name: Serverless Starter Warehouse

# Reasoning + embedding are served as Unity Gateway model services (governed,
# auditable, no self-managed endpoints). The agent calls them via the AI Gateway.
models:
  reasoning_model_service: "fe-bar-ir.adjudication-agent.adjudication-reasoning"
  reasoning_gateway_path: "/ai-gateway/mlflow/v1/chat/completions"
  embedding_model_service: "fe-bar-ir.adjudication-agent.embedding"
  embedding_gateway_path: "/ai-gateway/mlflow/v1/embeddings"
  # 1024-dim, NOT normalized -> we L2-normalize and use cosine. No dimensions param.
  embedding_dim: 1024
  embedding_normalization: "l2"

# Policy corpus — authored once, loaded into Lakebase by lakebase/src/policy_intake.py.
policy:
  source: lakebase/src/policy_source.json      # single source of truth
  param_tables: [spec_params, warranty_terms]  # read by the deterministic authorities
  clause_tables: [spec_clauses, warranty_clauses]  # embedded + tsvector, hybrid retrieval
  # The deterministic authorities (compute_conformance, compute_coverage,
  # compute_settlement, duplicate detection) run IN-PROCESS in the agent as plain
  # Python — they are NOT registered UC functions. They read the structured params
  # from the Lakebase policy tables above (via the read-only UC mirror).

# Lakebase Autoscaling (Postgres, OLTP). Non-secret identifiers only; the OAuth
# credential is minted at runtime by the SDK, never stored here.
lakebase:
  project: fe-bar-operational-plane
  branch: production
  endpoint: projects/fe-bar-operational-plane/branches/production/endpoints/primary
  port: 5432
  pg_version: 17                        # PG17 required for Lakehouse Sync (Beta)
  database: databricks_postgres
  # Read-only UC mirror of Lakebase; the authorities read structured params here.
  catalog_mirror: fe_bar_operational
  # Credentials come from the SDK OAuth credential provider at runtime (no scope needed).

# Kafka (Aiven) — existing service fe-bar-kafka (project kafka-dbx-pipeline-001).
kafka:
  provider: aiven
  service: fe-bar-kafka                 # existing free-0 service; do NOT create a new cluster
  bootstrap_servers: "fe-bar-kafka-kafka-dbx-pipeline-001.i.aivencloud.com:25358"  # SASL_SSL
  security_protocol: SASL_SSL
  sasl_mechanism: SCRAM-SHA-256
  topics:
    claim_submitted: claim.submitted    # 2 partitions, RF 2, 7d retention (free-0 caps)
    claim_adjudicated: claim.adjudicated
  # SASL creds + CA cert live ONLY in this scope, referenced by name, never inline.
  secret_scope: fe-bar-aiven-kafka
  secret_keys: [bootstrap-servers, sasl-username, sasl-password, ssl-ca-pem]
  # Services authenticate to the endpoint/Lakebase AS the application service
  # principal (credentials in the claims-agent secret scope).
  app_sp_secret_scope: claims-agent
