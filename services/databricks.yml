bundle:
  name: fe-bar-services

# Each service is its own resource file (producer, worker, relay, consumers, migrate).
include:
  - resources/*.yml

variables:
  catalog:
    default: fe-bar-ir
  endpoint:
    description: Lakebase endpoint (OAuth credential minted at runtime; no secret stored)
    default: projects/fe-bar-operational-plane/branches/production/endpoints/primary
  postgres_database:
    default: databricks_postgres
  sp_role:
    description: Postgres role of the Wave 6 application SP (its app UUID; not a secret)
    default: 47643eb1-dbd5-40a6-a51d-5da6b8e2da7a
  cdf_claims_table:
    description: Native Lakebase CDF history table for claims — the producer's source
    default: fe-bar-ir.cdf.lb_claims_history
  producer_checkpoint:
    description: Volume path for the availableNow producer stream checkpoint
    default: /Volumes/fe-bar-ir/bronze/raw_landing/_kafka_checkpoints/claim_submitted
  worker_max_messages:
    description: Max claim.submitted messages the bounded worker drains per run
    default: "6000"
  relay_max_events:
    description: Max unpublished outbox rows the relay drains per run
    default: "6000"
  consumer_max_messages:
    description: Max claim.adjudicated messages each consumer drains per run
    default: "6000"

targets:
  prod:
    default: true
    mode: production
    workspace:
      profile: fe-bar
      root_path: /Workspace/Users/irtebat.shaukat@databricks.com/.bundle/fe-bar-services/prod
