bundle:
  name: steel-claims
variables:
  catalog:
    description: Unity Catalog supplied by settings.yaml or --var
  claim_count:
    description: Number of claims; configured in settings.yaml
  seed:
    description: Faker seed; configured in settings.yaml
  warranty_schedule:
    description: Warranty version schedule JSON, sourced from the policy by run.py
    default: "[]"
  cdf_claims_table:
    description: Fully qualified native Lakebase CDF table for claims
    default: fe-bar-ir.cdf.lb_claims_history
  cdf_adjudications_table:
    description: Fully qualified native Lakebase CDF table for adjudications
    default: fe-bar-ir.cdf.lb_adjudications_history
  cdf_decision_records_table:
    description: Fully qualified native Lakebase CDF table for adjudication decision records
    default: fe-bar-ir.cdf.lb_adjudication_decision_records_history
resources:
  pipelines:
    medallion:
      name: steel-claims
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false
      development: false
      root_path: ./src
      libraries:
        - glob:
            include: ./src/transformations/**
      configuration:
        claims.catalog: ${var.catalog}
        claims.cdf_claims_table: ${var.cdf_claims_table}
        claims.cdf_adjudications_table: ${var.cdf_adjudications_table}
        claims.cdf_decision_records_table: ${var.cdf_decision_records_table}
  jobs:
    validate_generator:
      name: steel-claims-validate-generator
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: claim_count
          default: ${var.claim_count}
        - name: seed
          default: ${var.seed}
        - name: warranty_schedule
          default: ${var.warranty_schedule}
      tasks:
        - task_key: validate
          notebook_task:
            notebook_path: ./src/generate.py
            base_parameters:
              validate_only: "true"
          timeout_seconds: 3600
          max_retries: 0
    generate_raw:
      name: steel-claims-generate-raw
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: claim_count
          default: ${var.claim_count}
        - name: seed
          default: ${var.seed}
        - name: warranty_schedule
          default: ${var.warranty_schedule}
      tasks:
        - task_key: generate
          notebook_task:
            notebook_path: ./src/generate.py
          timeout_seconds: 3600
          max_retries: 0
    process_cdf:
      name: steel-claims-process-cdf
      max_concurrent_runs: 1
      tasks:
        - task_key: medallion
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion.id}
      queue:
        enabled: true
targets:
  prod:
    default: true
    mode: production
    workspace:
      profile: fe-bar
      # Production deployment state.
      root_path: /Workspace/Users/irtebat.shaukat@databricks.com/.bundle/steel-claims/prod
    variables:
      catalog: fe-bar-ir
      claim_count: 5000
      seed: 42
