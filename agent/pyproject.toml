[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Databricks supplies spark and dbutils in the notebook job.
"src/fraud_graph_job.py" = ["F821"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
