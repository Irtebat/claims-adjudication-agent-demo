bundle:
  name: fe-bar-agent

variables:
  catalog:
    default: fe-bar-ir

resources:
  jobs:
    fraud_graph:
      name: fe-bar-fraud-graph
      max_concurrent_runs: 1
      tasks:
        - task_key: customer_heat_risk
          notebook_task:
            notebook_path: ./src/fraud_graph_job.py
            base_parameters:
              catalog: ${var.catalog}
          timeout_seconds: 3600
          max_retries: 0
      queue:
        enabled: true
    prior_claims_corpus:
      name: fe-bar-prior-claims-corpus
      description: |
        Builds gold.prior_claims_corpus (FINAL adjudications + coil master, governed GTE
        embeddings, change-only MERGE with Delta CDF). Served down to Lakebase as the
        Triggered synced table reference.prior_claims_corpus; re-sync it afterwards with
        `lakebase/run.py resync-synced-tables` (scripts/refresh.py does both).
      max_concurrent_runs: 1
      tasks:
        - task_key: build_corpus
          notebook_task:
            notebook_path: ./src/prior_claims_corpus_job.py
            base_parameters:
              catalog: ${var.catalog}
          timeout_seconds: 3600
          max_retries: 0
      queue:
        enabled: true
    deploy_claims_agent:
      name: fe-bar-deploy-claims-adjudication-agent
      max_concurrent_runs: 1
      environments:
        - environment_key: agent_deploy
          spec:
            client: "4"
            dependencies:
              - databricks-agents>=1.1.0
              - databricks-sdk>=0.81.0
      tasks:
        - task_key: deploy
          environment_key: agent_deploy
          spark_python_task:
            python_file: ./src/deploy_agent.py
          timeout_seconds: 3600
          max_retries: 0
      queue:
        enabled: true

targets:
  prod:
    default: true
    mode: production
    workspace:
      profile: fe-bar
      root_path: /Workspace/Users/irtebat.shaukat@databricks.com/.bundle/fe-bar-agent/prod
    variables:
      catalog: fe-bar-ir
