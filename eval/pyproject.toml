[project]
name = "claims-adjudication-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "databricks-agents>=1.1.0",
  "databricks-langchain",
  "databricks-sdk>=0.81.0",
  "langgraph",
  "mlflow[databricks]>=3.5.0,<4",
  "psycopg[binary]",
  "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
